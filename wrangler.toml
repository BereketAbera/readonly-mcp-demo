# Cloudflare Workers configuration for the read-only MCP server.
# Local check (no Cloudflare login needed): npx wrangler dev
name = "lakeside-readonly-mcp"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Plain, non-secret settings. Secrets are set with `wrangler secret put` (see README).
[vars]
UPSTREAM_MODE = "mock"
VENUE_TIMEZONE = "Australia/Brisbane"
RATE_LIMIT_PER_MINUTE = "60"
# Public token for the fictional demo data only. Ignored when UPSTREAM_MODE = "live".
MCP_PUBLIC_DEMO_TOKEN = "lakeside-demo-readonly"

# Per-token rate limit shared across isolates in a Cloudflare location.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "4201"

  [ratelimits.simple]
  limit = 60
  period = 60
