<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="300" viewBox="0 0 1104 300" font-family="Geist, sans-serif"><circle cx="8.5" cy="9" r="8.5" fill="#e7eefb"/><text x="8.5" y="12.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">9</text><text x="23" y="13" font-size="11" fill="#7a4a00" font-weight="600" letter-spacing="0.7">MOCKED IN THIS DEMO</text><rect x="0.5" y="30.5" width="195" height="79" rx="10" fill="#fff3d4" stroke="#c9a24f" stroke-dasharray="5 4"/><text x="14" y="57" font-size="15" fill="#0d1626" font-weight="600">Connecteam (AU)</text><text x="14" y="79" font-size="13" fill="#4a5466">staff, shifts, time clock,</text><text x="14" y="97" font-size="13" fill="#4a5466">pay rates</text><rect x="0.5" y="122.5" width="195" height="79" rx="10" fill="#fff3d4" stroke="#c9a24f" stroke-dasharray="5 4"/><text x="14" y="149" font-size="15" fill="#0d1626" font-weight="600">ROLLER</text><text x="14" y="171" font-size="13" fill="#4a5466">bookings, products,</text><text x="14" y="189" font-size="13" fill="#4a5466">payments, revenue</text><path d="M196 70C218 70 212 116 232 116" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 162C218 162 212 116 232 116" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 116H255" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M256 116L248 111.5V120.5Z" fill="#0d1626"/><rect x="256.5" y="67.5" width="203" height="97" rx="10" fill="#ffffff" stroke="#dbe0e7"/><text x="270" y="94" font-size="15" fill="#0d1626" font-weight="600">GET-only client</text><text x="270" y="116" font-size="13" fill="#4a5466">Reads a fixed list of paths.</text><text x="270" y="134" font-size="13" fill="#4a5466">Its only other call is the</text><text x="270" y="152" font-size="13" fill="#4a5466">sign-in token request.</text><circle cx="264.5" cy="53" r="8.5" fill="#e7eefb"/><text x="264.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">2</text><circle cx="285.5" cy="53" r="8.5" fill="#e7eefb"/><text x="285.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">3</text><circle cx="306.5" cy="53" r="8.5" fill="#e7eefb"/><text x="306.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">8</text><rect x="500.5" y="67.5" width="245" height="97" rx="10" fill="#ffffff" stroke="#dbe0e7"/><text x="514" y="94" font-size="15" fill="#0d1626" font-weight="600">Nine read-only tools</text><text x="514" y="116" font-size="13" fill="#4a5466">Named fields only, then</text><text x="514" y="134" font-size="13" fill="#4a5466">masked again. Dates checked,</text><text x="514" y="152" font-size="13" fill="#4a5466">31 days at most.</text><circle cx="508.5" cy="53" r="8.5" fill="#e7eefb"/><text x="508.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">1</text><circle cx="529.5" cy="53" r="8.5" fill="#e7eefb"/><text x="529.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">4</text><circle cx="550.5" cy="53" r="8.5" fill="#e7eefb"/><text x="550.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">5</text><rect x="786.5" y="67.5" width="131" height="97" rx="10" fill="#ffffff" stroke="#dbe0e7"/><text x="800" y="94" font-size="15" fill="#0d1626" font-weight="600">Gate</text><text x="800" y="116" font-size="13" fill="#4a5466">Bearer token,</text><text x="800" y="134" font-size="13" fill="#4a5466">origin list,</text><text x="800" y="152" font-size="13" fill="#4a5466">rate limit</text><circle cx="794.5" cy="53" r="8.5" fill="#e7eefb"/><text x="794.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">6</text><circle cx="815.5" cy="53" r="8.5" fill="#e7eefb"/><text x="815.5" y="56.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">7</text><rect x="958.5" y="67.5" width="145" height="97" rx="10" fill="#e6f5ec" stroke="#b3dbc3"/><text x="972" y="94" font-size="15" fill="#0d1626" font-weight="600">ClickUp AI</text><text x="972" y="116" font-size="13" fill="#4a5466">Brain or a</text><text x="972" y="134" font-size="13" fill="#4a5466">Super Agent</text><path d="M460 116H499" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 116L492 111.5V120.5Z" fill="#0d1626"/><path d="M746 116H785" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M786 116L778 111.5V120.5Z" fill="#0d1626"/><path d="M918 116H957" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M958 116L950 111.5V120.5Z" fill="#0d1626"/><path d="M358 165V199" fill="none" stroke="#b42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3.5"/><path d="M347 199H369" fill="none" stroke="#b42318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="256.5" y="211.5" width="203" height="54" rx="10" fill="#fdeeec" stroke="#f0c3bd"/><text x="270" y="234" font-size="13.5" fill="#b42318" font-weight="600">Stopped: every write</text><text x="270" y="253" font-size="12.5" fill="#b42318">POST, PUT, PATCH, DELETE</text><path d="M623 165V199" fill="none" stroke="#b42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3.5"/><path d="M612 199H634" fill="none" stroke="#b42318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="500.5" y="211.5" width="245" height="88" rx="10" fill="#fdeeec" stroke="#f0c3bd"/><text x="514" y="234" font-size="13.5" fill="#b42318" font-weight="600">Removed: personal details</text><text x="514" y="253" font-size="12.5" fill="#b42318">guest names, phone, email,</text><text x="514" y="270" font-size="12.5" fill="#b42318">address, birth date, bank, card,</text><text x="514" y="287" font-size="12.5" fill="#b42318">TFN, Medicare, medical flags</text><path d="M1031 165V211" fill="none" stroke="#0a6b39" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="786.5" y="211.5" width="317" height="88" rx="10" fill="#e6f5ec" stroke="#b3dbc3"/><text x="800" y="234" font-size="13.5" fill="#0a6b39" font-weight="600">What reaches ClickUp</text><text x="800" y="253" font-size="12.5" fill="#0d1626">staff names, shifts, hours, labour totals,</text><text x="800" y="270" font-size="12.5" fill="#0d1626">pay as department averages,</text><text x="800" y="287" font-size="12.5" fill="#0d1626">bookings, products, payments, revenue</text></svg>
