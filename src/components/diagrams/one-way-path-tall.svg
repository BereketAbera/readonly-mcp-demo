<svg xmlns="http://www.w3.org/2000/svg" width="320" height="847" viewBox="0 0 320 847" font-family="Geist, sans-serif"><circle cx="8.5" cy="9" r="8.5" fill="#e7eefb"/><text x="8.5" y="12.7" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">9</text><text x="23" y="13" font-size="11" fill="#7a4a00" font-weight="600" letter-spacing="0.7">MOCKED IN THIS DEMO</text><rect x="0.5" y="28.5" width="153" height="79" rx="10" fill="#fff3d4" stroke="#c9a24f" stroke-dasharray="5 4"/><text x="14" y="55" font-size="15" fill="#0d1626" font-weight="600">Connecteam (AU)</text><text x="14" y="77" font-size="13" fill="#4a5466">staff, shifts,</text><text x="14" y="95" font-size="13" fill="#4a5466">time clock, pay rates</text><rect x="166.5" y="28.5" width="153" height="79" rx="10" fill="#fff3d4" stroke="#c9a24f" stroke-dasharray="5 4"/><text x="180" y="55" font-size="15" fill="#0d1626" font-weight="600">ROLLER</text><text x="180" y="77" font-size="13" fill="#4a5466">bookings, products,</text><text x="180" y="95" font-size="13" fill="#4a5466">payments, revenue</text><path d="M40 108V141" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 142L35.5 134H44.5Z" fill="#0d1626"/><path d="M206 108V141" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 142L201.5 134H210.5Z" fill="#0d1626"/><rect x="0.5" y="142.5" width="319" height="77" rx="10" fill="#ffffff" stroke="#dbe0e7"/><text x="14" y="169" font-size="15" fill="#0d1626" font-weight="600">GET-only client</text><text x="14" y="191" font-size="13" fill="#4a5466">Reads a fixed list of paths. Its only</text><text x="14" y="209" font-size="13" fill="#4a5466">other call is the sign-in token request.</text><circle cx="255.5" cy="163.5" r="8.5" fill="#e7eefb"/><text x="255.5" y="167.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">2</text><circle cx="276.5" cy="163.5" r="8.5" fill="#e7eefb"/><text x="276.5" y="167.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">3</text><circle cx="297.5" cy="163.5" r="8.5" fill="#e7eefb"/><text x="297.5" y="167.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">8</text><path d="M192 220V248" fill="none" stroke="#b42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3.5"/><path d="M181 248H203" fill="none" stroke="#b42318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64.5" y="260.5" width="255" height="54" rx="10" fill="#fdeeec" stroke="#f0c3bd"/><text x="78" y="283" font-size="13.5" fill="#b42318" font-weight="600">Stopped: every write</text><text x="78" y="302" font-size="12.5" fill="#b42318">POST, PUT, PATCH, DELETE</text><path d="M40 220V344" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 345L35.5 337H44.5Z" fill="#0d1626"/><rect x="0.5" y="345.5" width="319" height="77" rx="10" fill="#ffffff" stroke="#dbe0e7"/><text x="14" y="372" font-size="15" fill="#0d1626" font-weight="600">Nine read-only tools</text><text x="14" y="394" font-size="13" fill="#4a5466">Named fields only, then masked again.</text><text x="14" y="412" font-size="13" fill="#4a5466">Dates checked, 31 days at most.</text><circle cx="255.5" cy="366.5" r="8.5" fill="#e7eefb"/><text x="255.5" y="370.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">1</text><circle cx="276.5" cy="366.5" r="8.5" fill="#e7eefb"/><text x="276.5" y="370.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">4</text><circle cx="297.5" cy="366.5" r="8.5" fill="#e7eefb"/><text x="297.5" y="370.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">5</text><path d="M192 423V451" fill="none" stroke="#b42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3.5"/><path d="M181 451H203" fill="none" stroke="#b42318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64.5" y="463.5" width="255" height="88" rx="10" fill="#fdeeec" stroke="#f0c3bd"/><text x="78" y="486" font-size="13.5" fill="#b42318" font-weight="600">Removed: personal details</text><text x="78" y="505" font-size="12.5" fill="#b42318">guest names, phone, email, address,</text><text x="78" y="522" font-size="12.5" fill="#b42318">birth date, bank, card, TFN,</text><text x="78" y="539" font-size="12.5" fill="#b42318">Medicare, medical flags</text><path d="M40 423V581" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 582L35.5 574H44.5Z" fill="#0d1626"/><rect x="0.5" y="582.5" width="319" height="59" rx="10" fill="#ffffff" stroke="#dbe0e7"/><text x="14" y="609" font-size="15" fill="#0d1626" font-weight="600">Gate</text><text x="14" y="631" font-size="13" fill="#4a5466">Bearer token, origin list, rate limit</text><circle cx="276.5" cy="603.5" r="8.5" fill="#e7eefb"/><text x="276.5" y="607.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">6</text><circle cx="297.5" cy="603.5" r="8.5" fill="#e7eefb"/><text x="297.5" y="607.2" font-size="10.5" fill="#143b8f" font-weight="600" text-anchor="middle">7</text><path d="M40 642V675" fill="none" stroke="#0d1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 676L35.5 668H44.5Z" fill="#0d1626"/><rect x="0.5" y="676.5" width="319" height="59" rx="10" fill="#e6f5ec" stroke="#b3dbc3"/><text x="14" y="703" font-size="15" fill="#0d1626" font-weight="600">ClickUp AI</text><text x="14" y="725" font-size="13" fill="#4a5466">Brain or a Super Agent</text><path d="M40 736V758" fill="none" stroke="#0a6b39" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="0.5" y="758.5" width="319" height="88" rx="10" fill="#e6f5ec" stroke="#b3dbc3"/><text x="14" y="781" font-size="13.5" fill="#0a6b39" font-weight="600">What reaches ClickUp</text><text x="14" y="800" font-size="12.5" fill="#0d1626">staff names, shifts, hours, labour</text><text x="14" y="817" font-size="12.5" fill="#0d1626">totals, pay as department averages,</text><text x="14" y="834" font-size="12.5" fill="#0d1626">bookings, products, payments, revenue</text></svg>
